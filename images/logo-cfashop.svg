<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Dégradé Signature Orange / Ambre Hype -->
    <linearGradient id="cfaGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a00" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0.2" />
    </linearGradient>

    <!-- Dégradé Or Métallique pour Monogramme CFA -->
    <linearGradient id="cfaGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Dégradé Sombre Obsidian -->
    <linearGradient id="cfaDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Ombre Portée Subtile -->
    <filter id="cfaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ea580c" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Groupe Emblème Sneaker / Monogramme CFA -->
  <g transform="translate(10, 8)" filter="url(#cfaGlow)">
    <!-- Fond Carré Arrondi Dynamique -->
    <rect x="0" y="0" width="104" height="104" rx="26" fill="url(#cfaDarkGrad)" />
    <rect x="2" y="2" width="100" height="100" rx="24" stroke="url(#cfaGoldGrad)" stroke-width="2.5" fill="none" opacity="0.8" />

    <!-- Silhouette Stylisée Sneaker Streetwear -->
    <path d="M 22 68 Q 28 74 38 74 L 80 74 Q 88 74 90 68 Q 91 62 82 58 L 68 54 Q 60 40 48 38 Q 36 36 32 46 L 24 58 Q 20 63 22 68 Z" fill="none" stroke="#ea580c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 28 62 C 40 60, 56 62, 78 66" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
    <circle cx="70" cy="50" r="3" fill="#fbbf24" />
    <circle cx="62" cy="46" r="3" fill="#fbbf24" />

    <!-- Monogramme CFA Stylisé -->
    <text x="52" y="58" font-family="'Plus Jakarta Sans', Impact, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="-1">CFA</text>
    <text x="52" y="86" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="url(#cfaGoldGrad)" text-anchor="middle" letter-spacing="3">BAMAKO</text>
  </g>

  <!-- Typographie CFASHOP & Baseline -->
  <g transform="translate(130, 0)">
    <!-- Nom de marque principal -->
    <text x="0" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="46" fill="#0f172a" letter-spacing="3">
      CFA<tspan fill="url(#cfaGradPrimary)">SHOP</tspan>
    </text>

    <!-- Point Lumineux Décoratif -->
    <circle cx="275" cy="50" r="6" fill="#ea580c" />
    <circle cx="275" cy="50" r="10" stroke="#f59e0b" stroke-width="1.5" opacity="0.6" />

    <!-- Tagline & Origine -->
    <rect x="0" y="78" width="12" height="3" rx="1.5" fill="#ea580c" />
    <text x="22" y="88" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" fill="#ea580c" letter-spacing="3.5">
      BAMAKO • STREETWEAR &amp; SNEAKERS US
    </text>
    <text x="22" y="103" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="10.5" fill="#64748b" letter-spacing="1.5">
      BOUTIQUE OFFICIELLE • DIALAKOROBOUGOU
    </text>
  </g>
</svg>
